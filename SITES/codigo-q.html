
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17251d">
<title>Códigos Q — Guia de Comunicação Rádio</title>
<style>
:root {
  --bg: #0c1410;
  --panel: #17231b;
  --panel2: #1e2e23;
  --line: #354b39;
  --text: #edf2e9;
  --muted: #aab8a8;
  --olive: #a8c76a;
  --lime: #d1e58b;
  --red: #e64b4b;
  --gold: #e5b75d;
  --blue: #73b8e8;
  --shadow: 0 18px 48px #0005;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(ellipse at 15% 0%, #293c2b 0, transparent 38%),
              radial-gradient(ellipse at 100% 25%, #30251b 0, transparent 30%),
              var(--bg);
  color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  min-height: 100vh;
}

.wrap {
  max-width: 1180px;
  margin: auto;
  padding: 28px 20px 54px;
}

/* Barra de pesquisa */
.toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  margin: 0 0 24px;
}

.search {
  flex: 1;
  position: relative;
}

.search input {
  width: 100%;
  background: #111c15;
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 15px 16px 15px 46px;
  color: var(--text);
  font: inherit;
  outline: none;
  box-shadow: 0 8px 24px #0003;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search input:focus {
  border-color: var(--olive);
  box-shadow: 0 0 0 3px #a8c76a25, 0 8px 24px #0004;
}

.search:before {
  content: "⌕";
  position: absolute;
  left: 16px;
  top: 8px;
  font-size: 1.8rem;
  color: var(--olive);
  pointer-events: none;
}

/* Grade e cartões dos códigos */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
  gap: 13px;
}

.card {
  position: relative;
  min-height: 145px;
  padding: 17px 18px 18px;
  border: 1px solid #344638;
  border-radius: 17px;
  background: linear-gradient(145deg, #1b2a20, #142018);
  box-shadow: 0 8px 20px #0002;
  transition: transform 0.18s, border-color 0.18s;
}

.card:hover {
  transform: translateY(-3px);
  border-color: #78935a;
}

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.code {
  font-size: 1.65rem;
  font-weight: 900;
  letter-spacing: 0.025em;
  color: var(--lime);
  line-height: 1.1;
}

.tag {
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #c1d4a0;
  border: 1px solid #536a45;
  border-radius: 7px;
  padding: 4px 7px;
}

.meaning {
  font-size: 1.02rem;
  font-weight: 700;
  margin: 13px 0 5px;
  color: #f3f5ed;
}

.detail {
  font-size: 0.85rem;
  color: #aebdad;
  margin: 0;
}

.card:before {
  content: "";
  position: absolute;
  left: 0;
  top: 18px;
  bottom: 18px;
  width: 3px;
  border-radius: 0 4px 4px 0;
  background: var(--red);
  opacity: 0.9;
}

.no-results {
  display: none;
  padding: 28px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: 16px;
}

@media (max-width: 600px) {
  .wrap {
    padding: 16px 12px 35px;
  }
  .card {
    min-height: 125px;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <!-- Barra de pesquisa isolada -->
  <div class="toolbar">
    <div class="search">
      <input id="search" type="search" placeholder="Pesquisar código ou significado (ex.: QSL, QTH, localização)…" aria-label="Pesquisar código ou significado">
    </div>
  </div>

  <!-- Grade de cartões -->
  <div class="grid" id="grid"></div>
  <div class="no-results" id="empty">Nenhum código encontrado. Tente outra palavra ou código.</div>
</div>

<script>
// Lista completa de códigos Q e abreviações
const entries = [
  ["QAP", "Na escuta; fique na escuta.", "Manter-se atento ao canal.", "radio"],
  ["QAR", "Desligar / abandonar a escuta.", "Encerrar a escuta do canal.", "radio"],
  ["QRA", "Qual é o seu nome? / nome.", "Identificação do operador.", "radio"],
  ["QRX", "Aguarde um instante / aguardar.", "Pausa breve antes de continuar.", "radio"],
  ["QRL", "Estou ocupado; não interfira.", "A imagem indica: quase não usado.", "radio"],
  ["QRZ", "Quem me chama?", "Pergunta sobre a estação chamadora.", "radio"],
  ["QSO", "Contato / comunicação com outra estação.", "Solicitar permissão para falar com alguém; “fazer QSO”.", "radio"],
  ["QRV", "Estou pronto / às ordens.", "Também aparece como “tenho QTC para você” ou “estou à disposição”.", "radio"],
  ["QTC", "Mensagem; tenho mensagem para você.", "Informação ou mensagem a transmitir.", "radio"],
  ["QTH", "Local onde você está? / local, endereço.", "Usado para perguntar ou informar localização.", "operacional"],
  ["QSL", "Positivo; entendido; recebi.", 'QSL significa "entendido" ou "mensagem recebida e compreendida".', "radio"],
  ["QRU", "Nada mais tenho a transmitir.", "Em outra tabela: novidade ou problema. O sentido pode variar conforme o padrão local.", "radio"],
  ["QTA", "Cancele tudo o que falei / cancelar última informação.", "Na primeira imagem: “última forma”.", "radio"],
  ["QTO", "Banheiro / sanitário.", "Local de necessidade fisiológica.", "operacional"],
  ["QRF", "Finalizando transmissão.", "Conforme a primeira imagem enviada.", "radio"],
  ["QSZ", "Repita a QTC, uma vez.", "Solicitação para repetir a mensagem.", "radio"],
  ["QRS", "Transmita mais devagar.", "Reduzir a velocidade da transmissão.", "radio"],
  ["QRQ", "Transmita mais depressa.", "Aumentar a velocidade da transmissão.", "radio"],
  ["QSY", "Mudança de frequência de rádio.", "Mudar para outra frequência.", "radio"],
  ["QRT", "Desligar rádio / encerrar transmissão.", "Também descrito como informar que a comunicação está sendo encerrada.", "radio"],
  ["QSP", "Ponte; transmita esta QTC para…", "Retransmitir mensagem a outra estação.", "radio"],
  ["QTI", "Deslocamento; para onde devo ir?", "Indicação/pergunta sobre destino.", "operacional"],
  ["QNT", "A que horas você saiu de…", "Horário de saída de um local.", "operacional"],
  ["QTJ", "Qual é a sua velocidade?", "Pergunta sobre velocidade.", "operacional"],
  ["QSA", "Inteligibilidade do sinal (compreensão).", "Avaliação da compreensão do sinal.", "radio"],
  ["QRK", "Intensidade do som (está audível).", "Avaliação da audibilidade/clareza do sinal.", "radio"],
  ["QSM", "Devo repetir minha última QTC? / repetir.", "Na primeira imagem: “Devo repetir minha última QTC?”; na segunda: “Repetir”.", "radio"],
  ["QSV (VTR)", "Viatura.", "Abreviação indicada na segunda imagem.", "operacional"],
  ["QTR", "Horário exato.", "Indicação de hora exata.", "operacional"],
  ["QTU", "Horário.", "Indicação de horário.", "operacional"],
  ["QTY", "A caminho.", "Indica deslocamento a caminho.", "operacional"],
  ["NIL / NIHil", "Nada.", "Código apresentado na segunda imagem.", "apoio"],
  ["TKS", "Obrigado.", "Agradecimento.", "apoio"],
  ["QSJ", "Dinheiro.", "Abreviação indicada na primeira imagem.", "apoio"],
  ["KMI", "Kilometragem inicial.", "Registro de quilometragem no início.", "operacional"],
  ["KMF", "Kilometragem final.", "Registro de quilometragem no fim.", "operacional"]
];

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const empty = document.getElementById('empty');

// Renderiza e filtra os cartões em tempo real conforme a busca
function render() {
  const q = search.value.trim().toLowerCase();
  const shown = entries.filter(e => e.slice(0, 3).join(' ').toLowerCase().includes(q));

  grid.innerHTML = shown.map(e => `
    <article class="card">
      <div class="card-top">
        <div class="code">${e[0]}</div>
        <span class="tag">${e[3] === 'radio' ? 'Rádio' : e[3] === 'operacional' ? 'Operacional' : 'Apoio'}</span>
      </div>
      <div class="meaning">${e[1]}</div>
      <p class="detail">${e[2]}</p>
    </article>
  `).join('');

  empty.style.display = shown.length ? 'none' : 'block';
}

search.addEventListener('input', render);
render();
</script>
</body>
</html>
